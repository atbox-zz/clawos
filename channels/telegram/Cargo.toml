[package]
name    = "telegram"
version = "0.1.0"
edition = "2021"

[lib]
name       = "telegram"
path       = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde      = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tracing    = { version = "0.1" }
chrono     = { version = "0.4" }

# Host-side (for native tests)
[dev-dependencies]
chrono     = { version = "0.4" }
uuid       = { version = "1", features = ["v4"] }
