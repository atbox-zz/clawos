[package]
name    = "telegram"
version = "0.1.0"
edition = "2021"

[lib]
name       = "telegram"
path       = "src/lib.rs"
# FIX D-01: agent statically links telegram as a Cargo path dependency —
# cdylib is not needed and breaks x86_64-unknown-linux-musl (no dynamic linker).
# Removed crate-type entirely; Rust defaults to rlib which works everywhere.


[dependencies]
serde      = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tracing    = { version = "0.1" }
chrono     = { version = "0.4" }

# Host-side (for native tests)
[dev-dependencies]
chrono     = { version = "0.4" }
uuid       = { version = "1", features = ["v4"] }
